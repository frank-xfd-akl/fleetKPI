  <!-- Route nodes -->
  <circle cx="35" cy="27" r="6" fill="#FFFFFF" stroke="#1768D8" stroke-width="3.5"/>
  <circle cx="50" cy="55" r="6" fill="#FFFFFF" stroke="#1768D8" stroke-width="3.5"/>
  <circle cx="36" cy="86" r="6" fill="#FFFFFF" stroke="#1768D8" stroke-width="3.5"/>

  <!-- Location pin -->
  <path d="M35 9 C29.5 9 25.5 13.2 25.5 18.4 C25.5 25 35 33 35 33 S44.5 25 44.5 18.4 C44.5 13.2 40.5 9 35 9 Z"
        fill="#FF7A00"/>
  <circle cx="35" cy="18" r="3.2" fill="#FFFFFF"/>

  <!-- Analytics bars -->
  <rect x="67" y="71" width="12" height="20" rx="3" fill="#1768D8"/>
  <rect x="84" y="58" width="12" height="33" rx="3" fill="#18B85A"/>
  <rect x="101" y="43" width="12" height="48" rx="3" fill="#FF7A00"/>

  <!-- Baseline -->
