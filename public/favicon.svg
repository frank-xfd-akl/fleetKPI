<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Transit Analytics</title>
  <desc id="desc">Minimal route map and ascending analytics bars.</desc>

  <!-- Route -->
  <path d="M35 27 C52 27 64 29 64 43 C64 51 58 55 50 55 C37 55 25 62 25 74 C25 82 30 86 36 86"
